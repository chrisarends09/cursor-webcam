{% extends "base.html" %}

{% block content %}
<div class="container">
    <!-- Add navigation buttons at the top -->
    <div class="mb-4">
        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Back to Home</a>
    </div>
    <!-- Add New Webcam Button -->
    <div class="mt-4">
        <a href="{{ url_for('webcam.add') }}" class="btn btn-success">Add New Webcam</a>
    </div>

    <h2>Available Webcams</h2>
    <div class="row">
        {% for webcam in webcams %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ webcam.name }}</h5>
                    <p class="card-text">{{ webcam.description }}</p>
                    <p class="card-text"><small class="text-muted">Type: {{ webcam.type }}</small></p>
                    <div class="btn-group" role="group">
                        <a href="{{ url_for('webcam.edit_webcam', id=webcam.id) }}" class="btn btn-primary btn-sm">Edit</a>
                        <button type="button" class="btn btn-danger btn-sm" data-toggle="modal" data-target="#deleteModal{{ webcam.id }}">
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div class="modal fade" id="deleteModal{{ webcam.id }}" tabindex="-1" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirm Delete</h5>
                        <button type="button" class="close" data-dismiss="modal">
                            <span>&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete "{{ webcam.name }}"?
                    </div>
                    <div class="modal-footer">
                        <form action="{{ url_for('webcam.delete_webcam', id=webcam.id) }}" method="POST">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    
    
</div>
{% endblock %}
